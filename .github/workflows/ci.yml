# .github/workflows/ci.yml
# Runs the tests, each computer's split into parts that run side by side. While Wheelhouse is in
# early development, a pull request runs them on Linux only, and a push to main on Linux and macOS,
# so a problem only the Mac shows up straight after the merge. A run started by hand (Actions, CI,
# Run workflow) adds macOS or Windows where ticked. A pull request that changes only the design
# documents or the build plans passes the test jobs without running the tests
# (.github/scripts/plan.js). Checks the mod (validator, source, bridge imports and
# the mod's tests), and checks the lineage manifest against fresh copies of the upstream skills.
# all-checks passes only when every other job has, and is the one check the rule on main requires.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the tests on macOS, in three parts (for code only the Mac runs, and releases)
        type: boolean
        default: false
      windows:
        description: Also run the tests on Windows (up to most of an hour)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Plans the test jobs (.github/scripts/plan.js): the computers, how many parts each splits the
  # tests into, and whether a pull request that changes only text no test reads skips the tests.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # The merge of the pull request and its first parent, the base as it is now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: plan
        run: node .github/scripts/plan.js

  test:
    needs: plan
    name: test (${{ matrix.os }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        # Linux always; macOS on main and when ticked on a run started by hand, as a macOS minute
        # costs about ten Linux minutes; Windows only when ticked on a run started by hand. Linux splits the tests into two parts and macOS into
        # three, each part a job of its own (node --test-shard); any part failing fails the run.
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Each part takes a few minutes on Linux, longer on GitHub's busier macOS runners, and the
    # whole suite up to most of an hour on Windows, where starting a process is slow; a hung run
    # stops here, not at GitHub's six hours.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || matrix.os == 'macos-latest' && 30 || 15 }}
    steps:
      # A pull request that changes only text no test reads: the job passes without the tests.
      - if: needs.plan.outputs.tests == 'skip'
        run: echo "Only text no test reads changed, so the tests are skipped."
      - if: needs.plan.outputs.tests == 'run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.plan.outputs.tests == 'run'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # npm test's command with this job's part; npm test with no arguments runs the whole suite.
      - if: needs.plan.outputs.tests == 'run' && matrix.os != 'windows-latest'
        run: node --test --test-shard=${{ matrix.part }} --import ./tests/helpers/test-home.js --test-timeout=480000 "tests/**/*.test.js"
      # npm test with a longer limit per test file: on Windows the end-to-end build loop's file
      # runs past npm test's eight minutes, as each of its tests takes a minute or more there.
      - if: needs.plan.outputs.tests == 'run' && matrix.os == 'windows-latest'
        run: node --test --import ./tests/helpers/test-home.js --test-timeout=1500000 "tests/**/*.test.js"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Pins the version of Claude Code the mod's checks run on: the floor, lineage/manifest.json's
      # claudeCode.floor. The mod's bridge call lives in hooks/mod/ask.ts, which releases before
      # 2.1.299 refuse to follow (check 40 has the table of releases).
      # tests/scripts/lib/claude-code-floor.test.js holds the pin to CLAUDE_CODE_FLOOR.
      - run: npm install --global @anthropic-ai/claude-code@2.1.299
      - run: npm run mod-check

  # Fetches each upstream shallow at the manifest's commit and checks the fingerprints, the
  # register's anchors and carried text, and the marketplace's pins.
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/lineage/manifest.js verify

  # The test jobs' names change with the number of parts, so main's rule requires this job instead.
  # always() runs it even when a job it needs failed or was skipped, so it fails rather than skips.
  all-checks:
    needs: [plan, test, validate, lineage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          [ "$RESULTS" = "success success success success" ]
