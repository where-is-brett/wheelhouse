# .github/workflows/ci.yml
# Runs the tests on Linux and Windows, and on macOS once a pull request is out of
# draft or on main, checks the mod (validator, source, bridge imports and the mod's tests), and
# checks the lineage manifest against fresh copies of the upstream skills.
name: CI

on:
  pull_request:
    # ready_for_review starts the macOS run when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # A macOS minute costs about ten Linux minutes, and the tests run on the Mac
        # before every push, so a draft pull request leaves macOS out.
        os: ${{ fromJSON(github.event.pull_request.draft && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    # The tests take a few minutes on Linux and macOS, and up to most of an hour on Windows, where
    # starting a process is slow; a hung run stops here, not at GitHub's six hours.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: matrix.os != 'windows-latest'
        run: npm test
      # npm test with a longer limit per test file: on Windows the end-to-end build loop's file
      # runs past npm test's eight minutes, as each of its tests takes a minute or more there.
      - if: matrix.os == 'windows-latest'
        env:
          WH_DIAG: '1'
        run: node --test --import ./tests/helpers/test-home.js --test-timeout=1500000 tests/e2e/copilot-lean.test.js tests/scripts/agents/copilot-eval-runner.test.js tests/scripts/agents/copilot-translate.test.js tests/scripts/agents/copilot-wiring.test.js tests/scripts/eval/front-desk-scenarios.test.js tests/scripts/eval/harness.test.js tests/scripts/eval/scenarios-13-15-18.test.js tests/scripts/eval/scenarios-20-23.test.js tests/scripts/eval/scenarios-25-26-35.test.js tests/scripts/hooks/lineage-hold.test.js tests/scripts/hooks/session-start.test.js tests/scripts/host/helper-state.test.js tests/scripts/host/push-rules.test.js tests/scripts/install/survey.test.js tests/scripts/lean/store.test.js tests/scripts/lib/safe-git.test.js tests/scripts/mod/status.test.js tests/scripts/protection/locked.test.js tests/scripts/protection/settings.test.js tests/scripts/review/clean-session.test.js tests/scripts/setup/cli.test.js tests/scripts/setup/health.test.js tests/scripts/setup/host.test.js tests/scripts/setup/joining-run.test.js tests/scripts/setup/project-files.test.js tests/scripts/setup/tools.test.js tests/scripts/state/clone.test.js tests/scripts/state/lock.test.js tests/scripts/watcher/sources.test.js tests/scripts/windows/guarded.test.js tests/skills/tool-names.test.js  tests/scripts/lib/paths.test.js tests/scripts/host/helper.test.js

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Pins the version of Claude Code the mod's checks run on: the floor, lineage/manifest.json's
      # claudeCode.floor. The mod's bridge call lives in hooks/mod/ask.ts, which releases before
      # 2.1.299 refuse to follow (check 40 has the table of releases).
      # tests/scripts/lib/claude-code-floor.test.js holds the pin to CLAUDE_CODE_FLOOR.
      - run: npm install --global @anthropic-ai/claude-code@2.1.299
      - run: npm run mod-check

  # Fetches each upstream shallow at the manifest's commit and checks the fingerprints, the
  # register's anchors and carried text, and the marketplace's pins.
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/lineage/manifest.js verify
