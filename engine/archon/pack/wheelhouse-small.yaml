# engine/archon/pack/wheelhouse-small.yaml
{
  "name": "wheelhouse-small",
  "description": "Wheelhouse's small lane: a change that needs a short plan, from a work order to a pull request ready for the merge queue. It plans into tasks, builds them one at a time, and reviews with up to three fix rounds. Started by Wheelhouse with the work's id.",
  "inputs": {
    "work": {
      "required": true,
      "description": "The work's id. The order itself comes from Wheelhouse's helper, never through Archon."
    }
  },
  "returns": "open-pr",
  "nodes": [
    {
      "id": "order",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/order-copy.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --out \"$ARTIFACTS_DIR\" --flags",
      "timeout": 60000,
      "output_format": {
        "type": "object",
        "properties": {
          "visible": {
            "type": "boolean"
          },
          "showFirst": {
            "type": "boolean"
          }
        },
        "required": [
          "visible",
          "showFirst"
        ]
      }
    },
    {
      "id": "plan-gate",
      "depends_on": [
        "order"
      ],
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/plan-file.js\" --gate --base \"$BASE_BRANCH\"",
      "timeout": 60000,
      "output_format": {
        "type": "object",
        "properties": {
          "planned": {
            "type": "boolean"
          }
        },
        "required": [
          "planned"
        ]
      }
    },
    {
      "id": "plan",
      "depends_on": [
        "plan-gate"
      ],
      "when": "$plan-gate.output.planned == 'false'",
      "plugins": [
        "wheelhouse@wheelhouse"
      ],
      "context": "fresh",
      "model": "medium",
      "skills": [
        "wheelhouse:codebase-design"
      ],
      "idle_timeout": 600000,
      "prompt_file": "prompts/plan.md",
      "output_format": {
        "type": "object",
        "properties": {
          "summary": {
            "type": "string"
          },
          "tasks": {
            "type": "integer",
            "description": "how many tasks the plan holds"
          },
          "blocked": {
            "type": "boolean",
            "description": "true only for a level 3 or 4 question this step must not settle itself"
          },
          "question": {
            "type": "string",
            "description": "when blocked: the question, in plain words for a product owner"
          },
          "options": {
            "type": "array",
            "description": "when blocked: two to four answers",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
                },
                "label": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "label"
              ]
            }
          },
          "recommend": {
            "type": "string",
            "description": "when blocked: the id of the option you recommend"
          },
          "level": {
            "type": "string",
            "enum": [
              "3",
              "4"
            ],
            "description": "when blocked: the decision level"
          },
          "topic": {
            "type": "string",
            "description": "when blocked: a short kebab-case slug naming what the question is about"
          },
          "assumptions": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "every level 1 or 2 choice you made, one line each"
          }
        },
        "required": [
          "summary",
          "blocked",
          "assumptions"
        ]
      }
    },
    {
      "id": "plan-blocked",
      "depends_on": [
        "plan"
      ],
      "when": "$plan.output.blocked == 'true'",
      "wait": {
        "attention": "$plan.output.question",
        "form": "select",
        "options": "$plan.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$plan.output.level",
          "wh.topic": "$plan.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$plan.output.recommend"
        }
      }
    },
    {
      "id": "tasks",
      "depends_on": [
        "plan-gate",
        "plan",
        "plan-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$plan-gate.output.planned == 'true' || $plan.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/plan-file.js\" --tasks --base \"$BASE_BRANCH\"",
      "timeout": 60000
    },
    {
      "id": "each",
      "depends_on": [
        "tasks"
      ],
      "include": "wheelhouse-small-task",
      "fan_out": {
        "items": "$tasks.output",
        "as": "task",
        "max_parallel": 1
      }
    },
    {
      "id": "tasks-done",
      "depends_on": [
        "each"
      ],
      "bash": "records=$each.output; node \"$WHEELHOUSE_ROOT/scripts/engine/tasks-done.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\" --records \"$records\"",
      "timeout": 5100000,
      "output_format": {
        "type": "object",
        "properties": {
          "blocked": {
            "type": "boolean",
            "description": "true only for a level 3 or 4 question this step must not settle itself"
          },
          "question": {
            "type": "string",
            "description": "when blocked: the question, in plain words for a product owner"
          },
          "options": {
            "type": "array",
            "description": "when blocked: two to four answers",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
                },
                "label": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "label"
              ]
            }
          },
          "recommend": {
            "type": "string",
            "description": "when blocked: the id of the option you recommend"
          },
          "level": {
            "type": "string",
            "enum": [
              "3",
              "4"
            ],
            "description": "when blocked: the decision level"
          },
          "topic": {
            "type": "string",
            "description": "when blocked: a short kebab-case slug naming what the question is about"
          }
        },
        "required": [
          "blocked"
        ]
      }
    },
    {
      "id": "tasks-blocked",
      "depends_on": [
        "tasks-done"
      ],
      "when": "$tasks-done.output.blocked == 'true'",
      "wait": {
        "attention": "$tasks-done.output.question",
        "form": "select",
        "options": "$tasks-done.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$tasks-done.output.level",
          "wh.topic": "$tasks-done.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$tasks-done.output.recommend"
        }
      }
    },
    {
      "id": "tests",
      "depends_on": [
        "tasks-done",
        "tasks-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$tasks-done.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/protected-check.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\" --json",
      "timeout": 120000,
      "output_format": {
        "type": "object",
        "properties": {
          "clean": {
            "type": "boolean"
          },
          "findings": {
            "type": "string"
          }
        },
        "required": [
          "clean",
          "findings"
        ]
      }
    },
    {
      "id": "controls",
      "depends_on": [
        "tasks-done",
        "tasks-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$tasks-done.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/control-check.js\" --base \"$BASE_BRANCH\" --json",
      "timeout": 120000,
      "output_format": {
        "type": "object",
        "properties": {
          "clean": {
            "type": "boolean"
          },
          "paths": {
            "type": "string"
          }
        },
        "required": [
          "clean",
          "paths"
        ]
      }
    },
    {
      "id": "repair",
      "depends_on": [
        "tests",
        "controls"
      ],
      "when": "$tests.output.clean == 'false' || $controls.output.clean == 'false'",
      "plugins": [
        "wheelhouse@wheelhouse"
      ],
      "context": "fresh",
      "model": "medium",
      "idle_timeout": 600000,
      "prompt_file": "prompts/repair.md",
      "output_format": {
        "type": "object",
        "properties": {
          "summary": {
            "type": "string"
          },
          "blocked": {
            "type": "boolean",
            "description": "true only for a level 3 or 4 question this step must not settle itself"
          },
          "question": {
            "type": "string",
            "description": "when blocked: the question, in plain words for a product owner"
          },
          "options": {
            "type": "array",
            "description": "when blocked: two to four answers",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
                },
                "label": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "label"
              ]
            }
          },
          "recommend": {
            "type": "string",
            "description": "when blocked: the id of the option you recommend"
          },
          "level": {
            "type": "string",
            "enum": [
              "3",
              "4"
            ],
            "description": "when blocked: the decision level"
          },
          "topic": {
            "type": "string",
            "description": "when blocked: a short kebab-case slug naming what the question is about"
          },
          "assumptions": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "every level 1 or 2 choice you made, one line each"
          }
        },
        "required": [
          "summary",
          "blocked",
          "assumptions"
        ]
      }
    },
    {
      "id": "repair-blocked",
      "depends_on": [
        "repair"
      ],
      "when": "$repair.output.blocked == 'true'",
      "wait": {
        "attention": "$repair.output.question",
        "form": "select",
        "options": "$repair.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$repair.output.level",
          "wh.topic": "$repair.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$repair.output.recommend"
        }
      }
    },
    {
      "id": "tests-again",
      "depends_on": [
        "repair",
        "repair-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$repair.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/protected-check.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\" --json",
      "timeout": 120000,
      "output_format": {
        "type": "object",
        "properties": {
          "clean": {
            "type": "boolean"
          },
          "findings": {
            "type": "string"
          }
        },
        "required": [
