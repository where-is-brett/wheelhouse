          "findings"
        ]
      }
    },
    {
      "id": "controls-again",
      "depends_on": [
        "repair",
        "repair-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$repair.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/control-check.js\" --base \"$BASE_BRANCH\" --json",
      "timeout": 120000,
      "output_format": {
        "type": "object",
        "properties": {
          "clean": {
            "type": "boolean"
          },
          "paths": {
            "type": "string"
          }
        },
        "required": [
          "clean",
          "paths"
        ]
      }
    },
    {
      "id": "held",
      "depends_on": [
        "tests-again",
        "controls-again"
      ],
      "when": "$tests-again.output.clean == 'false' || $controls-again.output.clean == 'false'",
      "wait": {
        "attention": "The change still deletes, skips or loosens a test, or changes a file that steers agents, so it stops here.",
        "form": "select",
        "options": [
          {
            "id": "stop",
            "label": "Stop this work"
          },
          {
            "id": "rework",
            "label": "Send it back for a fresh run"
          }
        ],
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "3",
          "wh.topic": "tests-or-agent-files",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "stop"
        }
      }
    },
    {
      "id": "unplan",
      "depends_on": [
        "tests",
        "controls",
        "tests-again",
        "controls-again",
        "held"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$tests.output.clean == 'true' && $controls.output.clean == 'true' || $repair.output.blocked == 'false' && $tests-again.output.clean == 'true' && $controls-again.output.clean == 'true'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/unplan.js\" --base \"$BASE_BRANCH\"",
      "timeout": 60000,
      "output_format": {
        "type": "object",
        "properties": {
          "removed": {
            "type": "boolean"
          }
        },
        "required": [
          "removed"
        ]
      }
    },
    {
      "id": "review",
      "depends_on": [
        "unplan"
      ],
      "timeout": 3600000,
      "loop_group": {
        "max_iterations": 4,
        "fresh_context": true,
        "until_bash": "done=$verdict.output.done; [ \"$done\" = \"true\" ]",
        "nodes": [
          {
            "id": "fix",
            "when": "$LOOP_PREV.verdict.output.holds == 'true'",
            "plugins": [
