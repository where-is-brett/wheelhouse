                },
                "topic": {
                  "type": "string",
                  "description": "when blocked: a short kebab-case slug naming what the question is about"
                },
                "assumptions": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  },
                  "description": "every level 1 or 2 choice you made, one line each"
                }
              },
              "required": [
                "summary",
                "blocked",
                "assumptions"
              ]
            }
          },
          {
            "id": "fix-tests",
            "depends_on": [
              "fix"
            ],
            "when": "$LOOP_PREV.verdict.output.holds == 'true'",
            "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/protected-check.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\" --json",
            "timeout": 120000,
            "output_format": {
              "type": "object",
              "properties": {
                "clean": {
                  "type": "boolean"
                },
                "findings": {
                  "type": "string"
                }
              },
              "required": [
                "clean",
                "findings"
              ]
            }
          },
          {
            "id": "fix-controls",
            "depends_on": [
              "fix"
            ],
            "when": "$LOOP_PREV.verdict.output.holds == 'true'",
            "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/control-check.js\" --base \"$BASE_BRANCH\" --json",
            "timeout": 120000,
            "output_format": {
              "type": "object",
              "properties": {
                "clean": {
                  "type": "boolean"
                },
                "paths": {
                  "type": "string"
                }
              },
              "required": [
                "clean",
                "paths"
              ]
            }
          },
          {
            "id": "lenses",
            "depends_on": [
              "fix",
              "fix-tests",
              "fix-controls"
            ],
            "trigger_rule": "all_done",
            "bash": "held=$LOOP_PREV.verdict.output.held; ran=$LOOP_PREV.verdict.output.ran; node \"$WHEELHOUSE_ROOT/scripts/engine/lenses.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\" --held \"$held\" --ran \"$ran\"",
            "timeout": 60000,
            "output_format": {
              "type": "object",
              "properties": {
                "security": {
                  "type": "boolean"
                },
                "design": {
                  "type": "boolean"
                },
