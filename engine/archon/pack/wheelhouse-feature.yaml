# engine/archon/pack/wheelhouse-feature.yaml
{
  "name": "wheelhouse-feature",
  "description": "Wheelhouse's feature lane, once every slice of an approved feature has merged behind its switch: it switches the feature on, reviews the whole feature with up to three fix rounds on its own branch, walks the done checks on the preview, and waits for the director to approve switching it on. Started by Wheelhouse with the work's id.",
  "inputs": {
    "work": {
      "required": true,
      "description": "The work's id. The order itself comes from Wheelhouse's helper, never through Archon."
    }
  },
  "returns": "open-pr",
  "nodes": [
    {
      "id": "order",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/order-copy.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --out \"$ARTIFACTS_DIR\" --feature-flags",
      "timeout": 60000,
      "output_format": {
        "type": "object",
        "properties": {
          "visible": {
            "type": "boolean"
          },
          "showFirst": {
            "type": "boolean"
          },
          "demo": {
            "type": "boolean"
          },
          "flagFile": {
            "type": "boolean"
          },
          "topic": {
            "type": "string"
          },
          "words": {
            "type": "string"
          }
        },
        "required": [
          "visible",
          "showFirst",
          "demo",
          "flagFile",
          "topic",
          "words"
        ]
      }
    },
    {
      "id": "switch",
      "depends_on": [
        "order"
      ],
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/flag.js\" --on --run \"$WORKFLOW_ID\"",
      "timeout": 120000,
      "output_format": {
        "type": "object",
        "properties": {
          "switched": {
            "type": "boolean"
          }
        },
        "required": [
          "switched"
        ]
      }
    },
    {
      "id": "switch-on",
      "plugins": [
        "wheelhouse@wheelhouse"
      ],
      "depends_on": [
        "switch"
      ],
      "when": "$switch.output.switched == 'false'",
      "context": "fresh",
      "model": "medium",
      "idle_timeout": 600000,
      "prompt_file": "prompts/switch-on.md",
      "output_format": {
        "type": "object",
        "properties": {
          "summary": {
            "type": "string"
          },
          "blocked": {
            "type": "boolean",
            "description": "true only for a level 3 or 4 question this step must not settle itself"
          },
          "question": {
            "type": "string",
            "description": "when blocked: the question, in plain words for a product owner"
          },
          "options": {
            "type": "array",
            "description": "when blocked: two to four answers",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
                },
                "label": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "label"
              ]
            }
          },
          "recommend": {
            "type": "string",
            "description": "when blocked: the id of the option you recommend"
          },
          "level": {
            "type": "string",
            "enum": [
              "3",
              "4"
            ],
            "description": "when blocked: the decision level"
          },
          "topic": {
            "type": "string",
            "description": "when blocked: a short kebab-case slug naming what the question is about"
          },
          "assumptions": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "every level 1 or 2 choice you made, one line each"
          }
        },
        "required": [
          "summary",
          "blocked",
          "assumptions"
        ]
      }
    },
    {
      "id": "switch-on-blocked",
      "depends_on": [
        "switch-on"
      ],
      "when": "$switch-on.output.blocked == 'true'",
      "wait": {
        "attention": "$switch-on.output.question",
        "form": "select",
        "options": "$switch-on.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$switch-on.output.level",
          "wh.topic": "$switch-on.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$switch-on.output.recommend"
        }
      }
    },
    {
      "id": "tests",
      "depends_on": [
        "switch",
        "switch-on",
        "switch-on-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$switch.output.switched == 'true' || $switch-on.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/protected-check.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\" --json",
      "timeout": 120000,
      "output_format": {
        "type": "object",
        "properties": {
          "clean": {
            "type": "boolean"
          },
          "findings": {
            "type": "string"
          }
        },
        "required": [
          "clean",
          "findings"
        ]
      }
    },
    {
      "id": "controls",
      "depends_on": [
        "switch",
        "switch-on",
        "switch-on-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$switch.output.switched == 'true' || $switch-on.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/control-check.js\" --base \"$BASE_BRANCH\" --json",
      "timeout": 120000,
      "output_format": {
        "type": "object",
        "properties": {
          "clean": {
            "type": "boolean"
          },
          "paths": {
            "type": "string"
          }
        },
        "required": [
          "clean",
          "paths"
        ]
      }
    },
    {
      "id": "repair",
      "depends_on": [
        "tests",
        "controls"
      ],
      "when": "$tests.output.clean == 'false' || $controls.output.clean == 'false'",
      "plugins": [
        "wheelhouse@wheelhouse"
      ],
      "context": "fresh",
      "model": "medium",
      "idle_timeout": 600000,
      "prompt_file": "prompts/repair.md",
      "output_format": {
        "type": "object",
        "properties": {
          "summary": {
            "type": "string"
          },
          "blocked": {
            "type": "boolean",
            "description": "true only for a level 3 or 4 question this step must not settle itself"
          },
          "question": {
            "type": "string",
            "description": "when blocked: the question, in plain words for a product owner"
          },
          "options": {
            "type": "array",
            "description": "when blocked: two to four answers",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
                },
                "label": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "label"
              ]
            }
          },
          "recommend": {
            "type": "string",
            "description": "when blocked: the id of the option you recommend"
          },
          "level": {
            "type": "string",
            "enum": [
              "3",
              "4"
            ],
            "description": "when blocked: the decision level"
          },
          "topic": {
            "type": "string",
            "description": "when blocked: a short kebab-case slug naming what the question is about"
          },
          "assumptions": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "every level 1 or 2 choice you made, one line each"
          }
        },
        "required": [
          "summary",
          "blocked",
          "assumptions"
        ]
      }
    },
    {
      "id": "repair-blocked",
      "depends_on": [
        "repair"
      ],
      "when": "$repair.output.blocked == 'true'",
      "wait": {
        "attention": "$repair.output.question",
        "form": "select",
        "options": "$repair.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$repair.output.level",
          "wh.topic": "$repair.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$repair.output.recommend"
        }
      }
    },
    {
      "id": "tests-again",
      "depends_on": [
        "repair",
        "repair-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$repair.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/protected-check.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\" --json",
      "timeout": 120000,
      "output_format": {
        "type": "object",
        "properties": {
          "clean": {
            "type": "boolean"
          },
          "findings": {
            "type": "string"
          }
        },
        "required": [
