        "lesson"
      ],
      "when": "$lesson.output.blocked == 'true'",
      "wait": {
        "attention": "$lesson.output.question",
        "form": "select",
        "options": "$lesson.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$lesson.output.level",
          "wh.topic": "$lesson.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$lesson.output.recommend"
        }
      }
    },
    {
      "id": "lesson-record",
      "depends_on": [
        "lesson"
      ],
      "when": "$lesson.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/lesson.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\"",
      "timeout": 60000
    }
  ]
}
