                    "LOW"
                  ]
                },
                "file": {
                  "type": "string"
                },
                "line": {
                  "type": "integer"
                },
                "repro": {
                  "type": "string"
                },
                "fix": {
                  "type": "string"
                }
              },
              "required": [
                "severity",
                "file",
