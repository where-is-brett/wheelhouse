# engine/archon/pack/wheelhouse-bug.yaml
{
  "name": "wheelhouse-bug",
  "description": "Wheelhouse's bug lane: one reported bug reproduced with a failing test of its own, which joins the done checks, then fixed and taken to a pull request ready for the merge queue. Started by Wheelhouse with the work's id; a bug that proves bigger than a bug stops with a proposal.",
  "inputs": {
    "work": {
      "required": true,
      "description": "The work's id. The order itself comes from Wheelhouse's helper, never through Archon."
    }
  },
  "returns": "open-pr",
  "nodes": [
    {
      "id": "order",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/order-copy.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --out \"$ARTIFACTS_DIR\" --flags",
      "timeout": 60000,
      "output_format": {
        "type": "object",
        "properties": {
          "visible": {
            "type": "boolean"
          },
          "showFirst": {
            "type": "boolean"
          }
        },
        "required": [
          "visible",
          "showFirst"
        ]
      }
    },
    {
      "id": "reproduce-gate",
      "depends_on": [
        "order"
      ],
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/reproduce.js\" --gate --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\"",
      "timeout": 60000,
      "output_format": {
        "type": "object",
        "properties": {
          "reproduced": {
            "type": "boolean"
          }
        },
        "required": [
          "reproduced"
        ]
      }
    },
    {
      "id": "reproduce",
      "depends_on": [
        "reproduce-gate"
      ],
      "when": "$reproduce-gate.output.reproduced == 'false'",
      "plugins": [
        "wheelhouse@wheelhouse"
      ],
      "context": "fresh",
      "model": "medium",
      "skills": [
        "wheelhouse:codebase-design"
      ],
      "idle_timeout": 600000,
      "prompt_file": "prompts/reproduce.md",
      "output_format": {
        "type": "object",
        "properties": {
          "summary": {
            "type": "string"
          },
          "blocked": {
            "type": "boolean",
            "description": "true only for a level 3 or 4 question this step must not settle itself"
          },
          "question": {
            "type": "string",
            "description": "when blocked: the question, in plain words for a product owner"
          },
          "options": {
            "type": "array",
            "description": "when blocked: two to four answers",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
                },
                "label": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "label"
              ]
            }
          },
          "recommend": {
            "type": "string",
            "description": "when blocked: the id of the option you recommend"
          },
          "level": {
            "type": "string",
            "enum": [
              "3",
              "4"
            ],
            "description": "when blocked: the decision level"
          },
          "topic": {
            "type": "string",
            "description": "when blocked: a short kebab-case slug naming what the question is about"
          },
          "assumptions": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "every level 1 or 2 choice you made, one line each"
          },
          "test": {
            "type": "string",
            "description": "when reproduced: the failing test's exact name, run with the order's test command"
          },
          "command": {
            "type": "string",
            "description": "when reproduced and no test can be named: a command that ends with 0 once the bug is gone"
          },
          "files": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "when reproduced: the test files added or changed, as paths from the project's top"
          }
        },
        "required": [
          "summary",
          "blocked",
          "assumptions"
        ]
      }
    },
    {
      "id": "reproduce-blocked",
      "depends_on": [
        "reproduce"
      ],
      "when": "$reproduce.output.blocked == 'true'",
      "wait": {
        "attention": "$reproduce.output.question",
        "form": "select",
        "options": "$reproduce.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$reproduce.output.level",
          "wh.topic": "$reproduce.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$reproduce.output.recommend"
        }
      }
    },
    {
      "id": "red",
      "depends_on": [
        "reproduce-gate",
        "reproduce",
        "reproduce-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$reproduce-gate.output.reproduced == 'true' || $reproduce.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/reproduce.js\" --red --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\"",
      "timeout": 720000,
      "output_format": {
        "type": "object",
        "properties": {
          "red": {
            "type": "boolean"
          },
          "commit": {
            "type": "string"
          },
          "check": {
            "type": "object"
          },
          "line": {
            "type": "string"
          }
        },
        "required": [
          "red",
          "line"
        ]
      }
    },
    {
      "id": "red-held",
      "depends_on": [
        "red"
      ],
      "when": "$red.output.red == 'false'",
      "wait": {
        "attention": "$red.output.line",
        "form": "select",
        "options": [
          {
            "id": "rework",
            "label": "Try to reproduce it again"
          },
          {
            "id": "stop",
            "label": "Stop this work"
          }
        ],
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "3",
          "wh.topic": "no-reproduction",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "rework"
        }
      }
    },
    {
      "id": "reproduced",
      "depends_on": [
        "red"
      ],
      "when": "$red.output.red == 'true'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/reproduce.js\" --keep --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\"",
      "timeout": 60000,
      "output_format": {
        "type": "object",
        "properties": {
          "kept": {
            "type": "boolean"
          },
          "line": {
            "type": "string"
          }
        },
        "required": [
          "kept",
          "line"
        ]
      }
    },
    {
      "id": "keep-held",
      "depends_on": [
        "reproduced"
      ],
      "when": "$reproduced.output.kept == 'false'",
      "wait": {
        "attention": "$reproduced.output.line",
        "form": "select",
        "options": [
          {
            "id": "rework",
            "label": "Try to reproduce it again"
          },
          {
            "id": "stop",
            "label": "Stop this work"
          }
        ],
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "3",
          "wh.topic": "no-reproduction",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "rework"
        }
      }
    },
    {
      "id": "implement",
      "depends_on": [
        "reproduced"
      ],
      "model": "medium",
      "timeout": 900000,
      "loop_group": {
        "max_iterations": 5,
        "fresh_context": true,
        "until_bash": "blocked=$build.output.blocked; node \"$WHEELHOUSE_ROOT/scripts/engine/bug-check.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\" --most 5 --blocked \"$blocked\"",
        "nodes": [
          {
            "id": "build",
            "plugins": [
              "wheelhouse@wheelhouse"
            ],
            "skills": [
              "wheelhouse:codebase-design"
            ],
            "idle_timeout": 600000,
            "prompt_file": "prompts/fix-bug.md",
            "output_format": {
              "type": "object",
              "properties": {
                "summary": {
                  "type": "string"
                },
                "blocked": {
                  "type": "boolean",
                  "description": "true only for a level 3 or 4 question this step must not settle itself"
                },
                "question": {
                  "type": "string",
                  "description": "when blocked: the question, in plain words for a product owner"
                },
                "options": {
                  "type": "array",
                  "description": "when blocked: two to four answers",
                  "items": {
                    "type": "object",
                    "properties": {
                      "id": {
                        "type": "string",
                        "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
                      },
                      "label": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "id",
                      "label"
                    ]
                  }
                },
                "recommend": {
                  "type": "string",
                  "description": "when blocked: the id of the option you recommend"
                },
                "level": {
                  "type": "string",
                  "enum": [
                    "3",
                    "4"
                  ],
                  "description": "when blocked: the decision level"
                },
                "topic": {
                  "type": "string",
                  "description": "when blocked: a short kebab-case slug naming what the question is about"
                },
                "assumptions": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  },
                  "description": "every level 1 or 2 choice you made, one line each"
                }
              },
              "required": [
                "summary",
                "blocked",
                "assumptions"
              ]
            }
          }
        ]
      },
      "when": "$reproduced.output.kept == 'true'"
    },
    {
      "id": "implement-blocked",
      "depends_on": [
        "implement"
      ],
      "when": "$implement.output.blocked == 'true'",
      "wait": {
        "attention": "$implement.output.question",
        "form": "select",
        "options": "$implement.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$implement.output.level",
          "wh.topic": "$implement.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$implement.output.recommend"
        }
      }
    },
    {
      "id": "size",
      "depends_on": [
        "implement",
        "implement-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$implement.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/bug-size.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\"",
      "timeout": 1500000,
      "output_format": {
        "type": "object",
        "properties": {
          "blocked": {
            "type": "boolean"
          },
          "question": {
            "type": "string"
          },
          "options": {
            "type": "array",
            "description": "when blocked: two to four answers",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
                },
                "label": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "label"
              ]
            }
          },
          "recommend": {
            "type": "string"
          },
          "topic": {
            "type": "string"
          },
          "level": {
            "type": "string"
          },
          "line": {
            "type": "string"
          }
        },
        "required": [
          "blocked",
          "line"
        ]
      }
    },
    {
      "id": "size-blocked",
      "depends_on": [
        "size"
      ],
      "when": "$size.output.blocked == 'true'",
      "wait": {
        "attention": "$size.output.question",
        "form": "select",
        "options": "$size.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$size.output.level",
          "wh.topic": "$size.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$size.output.recommend"
        }
      }
    },
    {
      "id": "tests",
      "depends_on": [
        "size",
        "size-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$size.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/protected-check.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\" --json",
      "timeout": 120000,
      "output_format": {
        "type": "object",
        "properties": {
          "clean": {
            "type": "boolean"
          },
          "findings": {
            "type": "string"
          }
        },
        "required": [
          "clean",
          "findings"
        ]
      }
    },
    {
      "id": "controls",
      "depends_on": [
        "size",
        "size-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$size.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/control-check.js\" --base \"$BASE_BRANCH\" --json",
      "timeout": 120000,
      "output_format": {
        "type": "object",
        "properties": {
          "clean": {
            "type": "boolean"
          },
          "paths": {
            "type": "string"
          }
        },
        "required": [
          "clean",
          "paths"
        ]
      }
    },
    {
      "id": "held",
      "depends_on": [
        "tests",
        "controls"
      ],
      "when": "$tests.output.clean == 'false' || $controls.output.clean == 'false'",
      "wait": {
        "attention": "The change still deletes, skips or loosens a test, or changes a file that steers agents, so it stops here.",
        "form": "select",
        "options": [
          {
            "id": "stop",
            "label": "Stop this work"
          },
          {
            "id": "rework",
            "label": "Send it back for a fresh run"
          }
        ],
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "3",
          "wh.topic": "tests-or-agent-files",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "stop"
        }
      }
    },
    {
      "id": "lenses",
      "depends_on": [
        "tests",
        "controls",
        "held"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$tests.output.clean == 'true' && $controls.output.clean == 'true'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/lenses.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\"",
      "timeout": 60000,
      "output_format": {
        "type": "object",
        "properties": {
          "security": {
            "type": "boolean"
          },
          "design": {
            "type": "boolean"
          },
          "head": {
            "type": "string"
          },
          "clean": {
            "type": "boolean"
          }
        },
        "required": [
          "security",
          "design",
          "head",
          "clean"
        ]
      }
    },
    {
      "id": "review-standards",
      "plugins": [
        "wheelhouse@wheelhouse"
      ],
      "depends_on": [
        "lenses"
      ],
      "context": "fresh",
      "model": "medium",
      "denied_tools": [
        "Write",
        "Edit",
        "NotebookEdit"
      ],
      "idle_timeout": 600000,
      "prompt_file": "prompts/review-standards.md",
      "output_format": {
        "type": "object",
        "properties": {
          "verdict": {
            "type": "string",
            "enum": [
