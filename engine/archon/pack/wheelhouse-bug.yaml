      "depends_on": [
        "review-design",
        "review-security-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$review-design.output.blocked == 'true'",
      "wait": {
        "attention": "$review-design.output.question",
        "form": "select",
        "options": "$review-design.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$review-design.output.level",
          "wh.topic": "$review-design.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$review-design.output.recommend"
        }
      }
    },
    {
      "id": "pr-text",
      "plugins": [
        "wheelhouse@wheelhouse"
      ],
      "depends_on": [
        "review-standards",
        "review-spec",
        "review-security",
        "review-design",
        "review-design-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$review-standards.output.blocked == 'false' && $review-spec.output.blocked == 'false'",
      "context": "fresh",
      "model": "medium",
      "skills": [
        "wheelhouse:pr"
      ],
      "denied_tools": [
        "Edit",
        "NotebookEdit"
      ],
      "idle_timeout": 600000,
      "prompt_file": "prompts/pull-request.md",
      "output_format": {
        "type": "object",
        "properties": {
          "title": {
            "type": "string"
          },
          "blocked": {
            "type": "boolean",
            "description": "true only for a level 3 or 4 question this step must not settle itself"
          },
          "question": {
            "type": "string",
            "description": "when blocked: the question, in plain words for a product owner"
          },
          "options": {
            "type": "array",
            "description": "when blocked: two to four answers",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
                },
                "label": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "label"
              ]
            }
          },
          "recommend": {
            "type": "string",
            "description": "when blocked: the id of the option you recommend"
          },
          "level": {
            "type": "string",
            "enum": [
              "3",
              "4"
            ],
            "description": "when blocked: the decision level"
          },
          "topic": {
            "type": "string",
            "description": "when blocked: a short kebab-case slug naming what the question is about"
          },
          "assumptions": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "every level 1 or 2 choice you made, one line each"
          }
        },
        "required": [
          "title",
          "blocked",
          "assumptions"
        ]
      }
    },
    {
      "id": "pr-text-blocked",
      "depends_on": [
        "pr-text"
      ],
      "when": "$pr-text.output.blocked == 'true'",
      "wait": {
        "attention": "$pr-text.output.question",
        "form": "select",
        "options": "$pr-text.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$pr-text.output.level",
          "wh.topic": "$pr-text.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$pr-text.output.recommend"
        }
      }
    },
    {
      "id": "open-pr",
      "depends_on": [
        "pr-text",
        "pr-text-blocked"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$pr-text.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/open-pr.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\" --dir \"$ARTIFACTS_DIR\"",
      "timeout": 300000,
      "output_format": {
        "type": "object",
        "properties": {
          "branch": {
            "type": "string"
          },
          "pr": {
            "type": "integer"
          },
          "head": {
            "type": "string"
          }
        },
        "required": [
          "branch",
          "pr",
          "head"
        ]
      }
    },
    {
      "id": "sign",
      "depends_on": [
        "open-pr"
      ],
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/review-sign.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\"",
      "timeout": 120000,
      "output_format": {
        "type": "object",
        "properties": {
          "clean": {
            "type": "boolean"
          },
          "question": {
            "type": "string"
          }
        },
        "required": [
          "clean"
        ]
      }
    },
    {
      "id": "review-held",
      "depends_on": [
        "sign"
      ],
      "when": "$sign.output.clean == 'false'",
      "wait": {
        "attention": "$sign.output.question",
        "form": "select",
        "options": [
          {
            "id": "stop",
            "label": "Stop this work"
          },
          {
            "id": "rework",
            "label": "Send it back for a fresh run"
          }
        ],
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "3",
          "wh.topic": "review-findings",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "rework",
          "wh.pr": "$open-pr.output.pr",
          "wh.head": "$open-pr.output.head"
        }
      }
    },
    {
      "id": "preview",
      "depends_on": [
        "sign",
        "review-held"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "when": "$sign.output.clean == 'true'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/preview.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\" --base \"$BASE_BRANCH\" --out \"$ARTIFACTS_DIR/preview\"",
      "timeout": 600000,
      "output_format": {
        "type": "object",
        "properties": {
          "folder": {
            "type": "string"
          },
          "pictures": {
            "type": "integer"
          },
          "summary": {
            "type": "string"
          }
        },
        "required": [
          "folder",
          "pictures",
          "summary"
        ]
      }
    },
    {
      "id": "approval",
      "depends_on": [
        "preview"
      ],
      "when": "$order.output.showFirst == 'true'",
      "wait": {
        "attention": "This change is shown to you first. Approve it to send it to the merge queue, or reject it.",
        "form": "approval",
        "labels": {
          "wh.kind": "approval",
          "wh.level": "3",
          "wh.topic": "shown-first",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "approve",
          "wh.preview": "$preview.output.folder",
          "wh.pr": "$open-pr.output.pr",
          "wh.head": "$open-pr.output.head"
        }
      }
    },
    {
      "id": "rejected",
      "depends_on": [
        "approval"
      ],
      "when": "$approval.output.decision == 'reject'",
      "cancel": "The change wasn't approved, so it isn't sent to the merge queue."
    },
    {
      "id": "ready",
      "depends_on": [
        "preview",
        "approval",
        "rejected"
      ],
      "trigger_rule": "none_failed_min_one_success",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/ready.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\"",
      "timeout": 60000
    },
    {
      "id": "lesson",
      "plugins": [
        "wheelhouse@wheelhouse"
      ],
      "depends_on": [
        "ready"
      ],
      "context": "fresh",
      "model": "medium",
      "denied_tools": [
        "Write",
        "Edit",
        "NotebookEdit"
      ],
      "idle_timeout": 300000,
      "prompt_file": "prompts/lesson.md",
      "output_format": {
        "type": "object",
        "properties": {
          "lesson": {
            "type": "string",
            "description": "one lasting lesson, or empty when the code already shows it"
          },
          "blocked": {
            "type": "boolean",
            "description": "true only for a level 3 or 4 question this step must not settle itself"
          },
          "question": {
            "type": "string",
            "description": "when blocked: the question, in plain words for a product owner"
          },
          "options": {
            "type": "array",
            "description": "when blocked: two to four answers",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$"
                },
                "label": {
                  "type": "string"
                }
              },
              "required": [
                "id",
                "label"
              ]
            }
          },
          "recommend": {
            "type": "string",
            "description": "when blocked: the id of the option you recommend"
          },
          "level": {
            "type": "string",
            "enum": [
              "3",
              "4"
            ],
            "description": "when blocked: the decision level"
          },
          "topic": {
            "type": "string",
            "description": "when blocked: a short kebab-case slug naming what the question is about"
          },
          "assumptions": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "description": "every level 1 or 2 choice you made, one line each"
          }
        },
        "required": [
          "lesson",
          "blocked",
          "assumptions"
        ]
      }
    },
    {
      "id": "lesson-blocked",
      "depends_on": [
        "lesson"
      ],
      "when": "$lesson.output.blocked == 'true'",
      "wait": {
        "attention": "$lesson.output.question",
        "form": "select",
        "options": "$lesson.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$lesson.output.level",
          "wh.topic": "$lesson.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$lesson.output.recommend"
        }
      }
    },
    {
      "id": "lesson-record",
      "depends_on": [
        "lesson"
      ],
      "when": "$lesson.output.blocked == 'false'",
      "bash": "node \"$WHEELHOUSE_ROOT/scripts/engine/lesson.js\" --run \"$WORKFLOW_ID\" --artefacts \"$ARTIFACTS_DIR\"",
      "timeout": 60000
    }
  ]
}
