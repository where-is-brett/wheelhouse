        "form": "select",
        "options": "$review-standards.output.options",
        "labels": {
          "wh.kind": "blocked",
          "wh.level": "$review-standards.output.level",
          "wh.topic": "$review-standards.output.topic",
          "wh.work": "$INPUTS.work",
          "wh.recommend": "$review-standards.output.recommend"
        }
      }
