# probes/77-archon-skills/workflows/e4-prompt-text.yaml
name: e4-prompt-text
description: Item 8, the same task with tdd's key rules written into the prompt and no skill.
nodes:
  - id: implement
    model: medium
    idle_timeout: 240000
    prompt: |
      Do the work described in README.md, test first, by these rules:
      - Red before green: write one failing test, run it and see it fail, then write only enough code to pass it. Repeat one test at a time (vertical slices), never all tests first.
      - Test only through the public interface: the seam is the function formatPrice exported from src/price.ts; put its tests in test/price.test.ts. Don't test internals or mock collaborators.
      - Expected values come from the examples in README.md, never recomputed the way the code does.
      - No refactoring inside the loop.
      Nobody will answer questions in this step. Where a skill says to ask, confirm with or check with the user or a human partner, decide within the rules and record that decision as an assumption in your final report; if you cannot go on without an answer, stop at once and report status "blocked" with the reason. Committed code from earlier rounds stands: never delete it as "code written before a test". Run only the tests in focus while you work, and run the full suite (`bun test`) once, at the end.
      When the done check (`sh check.sh`) passes, commit your work with git.
    output_format:
      type: object
      properties:
        status: { type: string, enum: [done, assumption, blocked] }
        assumptions: { type: string }
        summary: { type: string }
      required: [status, assumptions, summary]
