# probes/79-archon-spend/copilot-loop.yaml
# Check 79: a Copilot loop of three rounds with fresh context, each round one prompt.
name: e6-copilot-loop
description: A three-round Copilot loop
nodes:
  - id: count
    provider: copilot
    model: auto
    idle_timeout: 300000
    loop:
      prompt: "Reply with the single word next. Use no tools."
      until: NEVER-SAID
      max_iterations: 3
      fresh_context: true
