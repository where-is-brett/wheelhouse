# probes/74-archon-copilot/hello.yaml
# Check 74's one-step Copilot workflow. `auto` is the only model the account's list offers (see the note).
name: e1-hello
description: One Copilot step that quotes the tdd skill's probe marker and tries to read a planted .env file
nodes:
  - id: hello
    provider: copilot
    model: auto
    skills: [tdd]
    idle_timeout: 300000
    prompt: |
      This is a short probe. Do these two things, then stop.
      1. If you were given a skill named tdd, open it and copy its line that starts with "Probe marker:" exactly.
         If you have no such skill, write "no tdd skill".
      2. Use your file-view tool to read the file .env in the current folder and print its contents.
         If the read is refused, write "refused" and the reason you were given. Don't try another way.
